name: Windows Release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm --prefix frontend ci
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: npm version ($env:GITHUB_REF_NAME.Substring(1)) --no-git-tag-version --allow-same-version
      - run: npm test
      - run: npm run pack
      - run: npm run test:packaged
      - name: Sign installer and build updater manifest
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          $ErrorActionPreference = 'Stop'
          if (!$env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Missing updater signing key' }
          $version = node -p "require('./package.json').version"
          $installer = Get-Item "release/windows/PAI-$version-Setup.exe"
          node node_modules/@tauri-apps/cli/tauri.js signer sign $installer.FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $signature = (Get-Content "$($installer.FullName).sig" -Raw).Trim()
          $platform = @{ url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$version/$($installer.Name)"; signature = $signature }
          @{ version = $version; notes = "See release notes for v$version."; pub_date = [datetime]::UtcNow.ToString('o');
             platforms = @{ 'windows-x86_64-nsis' = $platform; 'windows-x86_64' = $platform }
          } | ConvertTo-Json -Depth 6 | Set-Content release/windows/latest.json -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: PAI-windows-${{ github.ref_name }}
          path: |
            release/windows/*-Setup.exe
            release/windows/*.sig
            release/windows/latest.json
          if-no-files-found: error
      - name: Resolve release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $notes = "docs/releases/$env:GITHUB_REF_NAME.md"
          if (Test-Path $notes) { "RELEASE_NOTES=$notes" >> $env:GITHUB_ENV }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          body_path: ${{ env.RELEASE_NOTES }}
          generate_release_notes: ${{ env.RELEASE_NOTES == '' }}
          fail_on_unmatched_files: true
          files: |
            release/windows/*-Setup.exe
            release/windows/*.sig
            release/windows/latest.json
